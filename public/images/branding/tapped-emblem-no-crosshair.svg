<svg xmlns="http://www.w3.org/2000/svg" viewBox="390 180 800 560" fill="none">
  <title>TAPPED emblem without crosshair</title>
  <desc>Beveled platinum T, crimson blade and lightning point. Transparent background.</desc>
  <defs>
    <!-- Crimson is the base pigment; the other reds describe its lit and shaded bevels. -->
    <linearGradient id="crimson" x1="466" y1="78" x2="1060" y2="696" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f04763"/>
      <stop offset=".2" stop-color="#dc143c"/>
      <stop offset=".44" stop-color="#910d28"/>
      <stop offset=".68" stop-color="#dc143c"/>
      <stop offset="1" stop-color="#780b22"/>
    </linearGradient>
    <linearGradient id="platinum" x1="455" y1="217" x2="1100" y2="317" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f7f5f4"/>
      <stop offset=".23" stop-color="#d8d7d7"/>
      <stop offset=".5" stop-color="#97999c"/>
      <stop offset=".74" stop-color="#cccdce"/>
      <stop offset="1" stop-color="#f4f1f0"/>
    </linearGradient>
    <linearGradient id="stem-silver" x1="658" y1="372" x2="785" y2="489" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f6f4f3"/>
      <stop offset=".36" stop-color="#c5c6c7"/>
      <stop offset=".68" stop-color="#919397"/>
      <stop offset="1" stop-color="#eeebeb"/>
    </linearGradient>
    <linearGradient id="top-bevel" x1="790" y1="193" x2="790" y2="217" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f4f1ef"/>
      <stop offset=".22" stop-color="#77797b"/>
      <stop offset=".42" stop-color="#171719"/>
      <stop offset=".73" stop-color="#303032"/>
      <stop offset="1" stop-color="#e8e5e4"/>
    </linearGradient>
    <linearGradient id="lower-bevel" x1="787" y1="306" x2="787" y2="345" gradientUnits="userSpaceOnUse">
      <stop stop-color="#555052"/>
      <stop offset=".18" stop-color="#190d12"/>
      <stop offset=".67" stop-color="#10090c"/>
      <stop offset="1" stop-color="#710d24"/>
    </linearGradient>
    <linearGradient id="blade" x1="885" y1="350" x2="946" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#70091e"/>
      <stop offset=".35" stop-color="#a00e2b"/>
      <stop offset=".73" stop-color="#dc143c"/>
      <stop offset="1" stop-color="#ec3454"/>
    </linearGradient>
    <linearGradient id="blade-end" x1="810" y1="503" x2="810" y2="529" gradientUnits="userSpaceOnUse">
      <stop stop-color="#630c20"/>
      <stop offset=".24" stop-color="#230b13"/>
      <stop offset="1" stop-color="#10080c"/>
    </linearGradient>
    <linearGradient id="point" x1="635" y1="618" x2="655" y2="639" gradientUnits="userSpaceOnUse">
      <stop stop-color="#560819"/>
      <stop offset=".42" stop-color="#a00e2b"/>
      <stop offset=".64" stop-color="#dc143c"/>
      <stop offset=".75" stop-color="#ef566f"/>
      <stop offset="1" stop-color="#650a1d"/>
    </linearGradient>
    <linearGradient id="tick-face" x1="0" y1="0" x2="1" y2=".8">
      <stop stop-color="#ee647b"/>
      <stop offset=".25" stop-color="#dc143c"/>
      <stop offset=".7" stop-color="#ba1032"/>
      <stop offset="1" stop-color="#800c25"/>
    </linearGradient>
    <pattern id="brushed-metal" width="19" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-12)">
      <path d="M0 .5H13M5 3H19M0 5.5H8" stroke="#fff" stroke-opacity=".12" stroke-width=".6"/>
      <path d="M2 1.5H17M0 4H12M11 6H19" stroke="#18181b" stroke-opacity=".1" stroke-width=".45"/>
    </pattern>
    <path id="top-face" d="M434 215H1138L1038 308H523Z"/>
    <path id="stem-face" d="M729 342H892L628 600V466H603Z"/>
  </defs>

  <g id="monogram">
    <!-- A narrow lower lightning point sits behind the separate upper blade. -->
    <path d="M779 506L665 632L596 685L538 726L611 643L758 515Z" fill="#470916" stroke="#090609" stroke-width="9" stroke-linejoin="round"/>
    <path d="M769 515L654 640L546 718L621 637Z" fill="url(#point)"/>
    <path d="M766 523L650 643L561 705" stroke="#eb4867" stroke-width="2"/>
    <path d="M650 643L546 718L609 652L750 523" stroke="#7f0a25" stroke-width="2"/>
    <!-- Gunmetal sidewalls preserve the depth and notch of the silver T. -->
    <path d="M725 337H904L626 621V476H600V463Z" fill="#393338" stroke="#090609" stroke-width="10" stroke-linejoin="round"/>
    <path d="M603 466H628V600L620 619V473H600Z" fill="#716c70"/>
    <use href="#stem-face" fill="url(#stem-silver)"/>
    <use href="#stem-face" fill="url(#brushed-metal)"/>
    <path d="M603 466L729 342H892L628 600V466Z" stroke="#eeebeb" stroke-width="2"/>
    <path d="M628 600L892 342L900 341L626 620Z" fill="#680c20"/>
    <path d="M629 603L891 347" stroke="#b61b3b" stroke-width="1.5"/>
    <!-- The upper crimson facet ends in a squared bevel, as in the reference. -->
    <path d="M950 316H1047L856 534H774L764 505Z" fill="#62091c" stroke="#090609" stroke-width="10" stroke-linejoin="round"/>
    <path d="M951 321H1035L853 503H771Z" fill="url(#blade)"/>
    <path d="M951 321H1035L853 503H771Z" fill="url(#brushed-metal)" opacity=".45"/>
    <path d="M771 503H853V529H777Z" fill="url(#blade-end)"/>
    <path d="M853 503L1035 321L1042 321L855 530Z" fill="#72091f"/>
    <path d="M951 321H1035L853 503H771Z" stroke="#ef6b83" stroke-width="2"/>
    <path d="M776 503H850" stroke="#f6bac7" stroke-width="3"/>
    <path d="M777 529H853V505" stroke="#a01430" stroke-width="1.5"/>
    <!-- Broad platinum top bar, bright rim, dark recessed lower bevel. -->
    <path d="M406 193H1179L1043 320H950L929 343H531L406 214Z" fill="#100b0f" stroke="#090609" stroke-width="10" stroke-linejoin="round"/>
    <path d="M410 196H1173L1138 215H434Z" fill="url(#top-bevel)"/>
    <path d="M410 196L434 215L523 308L534 341L411 211Z" fill="#433237"/>
    <path d="M412 210L523 308L532 338L449 257Z" fill="#650c20"/>
    <path d="M523 308H1038L1043 320H950L930 341H535Z" fill="url(#lower-bevel)"/>
    <use href="#top-face" fill="url(#platinum)"/>
    <use href="#top-face" fill="url(#brushed-metal)"/>
    <path d="M410 196H1173L1138 215H434ZM434 215L523 308H1038L1138 215" stroke="#efedeb" stroke-width="2"/>
    <path d="M535 341H930M1040 310L1164 204" stroke="#a41130" stroke-width="2.5"/>
    <path d="M542 341H730" stroke="#dc143c" stroke-width="3"/>
    <path d="M690 341H726" stroke="#f0a0b2" stroke-width="2"/>
  </g>
</svg>
