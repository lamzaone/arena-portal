<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title description">
  <title id="title">BETA TESTER profile theme</title>
  <description id="description">Angular cyan and yellow circuitry on a dark blue field.</description>
  <defs>
