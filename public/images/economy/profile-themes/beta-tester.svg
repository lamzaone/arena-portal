      <stop offset="0" stop-color="#020817"/>
      <stop offset="0.58" stop-color="#071b35"/>
      <stop offset="1" stop-color="#0b2a46"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#67e8f9"/>
