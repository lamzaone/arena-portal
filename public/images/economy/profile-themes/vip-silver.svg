<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="title desc">
  <title id="title">VIP SILVER profile theme</title>
  <desc id="desc">brushed metal, vip collection, decorative effect level 1. An ARENA rank theme in #c8d0df.</desc>
  <defs>
    <radialGradient id="light" cx="50%" cy="35%" r="65%"><stop stop-color="#c8d0df" stop-opacity=".15"/><stop offset="1" stop-color="#080b11" stop-opacity="0"/></radialGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1a222e"/><stop offset=".46" stop-color="#080b11"/><stop offset="1" stop-color="#1a222e"/></linearGradient>
    <linearGradient id="gem" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#e3e8f1" stop-opacity=".85"/><stop offset=".48" stop-color="#c8d0df" stop-opacity=".25"/><stop offset="1" stop-color="#c8d0df" stop-opacity=".58"/></linearGradient>
