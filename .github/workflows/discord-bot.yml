name: Discord bot checks

on:
  push:
    branches: [main]
    paths: ['discord-bot/**', '.github/workflows/discord-bot.yml']
  pull_request:
    branches: [main]
    paths: ['discord-bot/**', '.github/workflows/discord-bot.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: discord-bot
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: discord-bot/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
