name: FreakHosting

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never cancel an activation halfway through. PRs have separate queues.
concurrency:
  group: freakhosting-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      SITE_URL: ${{ vars.SITE_URL || 'https://tapped.ro' }}
      NEXT_PUBLIC_SERVER_NAME: ${{ vars.NEXT_PUBLIC_SERVER_NAME || 'ARENA.TAPPED.RO' }}
      NEXT_PUBLIC_SERVER_CONNECT_URL: ${{ vars.NEXT_PUBLIC_SERVER_CONNECT_URL || 'steam://connect/arena.tapped.ro' }}
      ECONOMY_PRICE_REFRESH_ENABLED: 'false'
      RELEASE_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --include=dev
      - run: npm test
      - name: Test packaging, SSH transport, restart and rollback
        run: |
          python3 scripts/hosting/package.test.py
          python3 scripts/hosting/deploy.test.py
          python3 scripts/hosting/activate.test.py
      - run: npm run build:release
      - name: Install thumbnail browser for the Linux runtime
        run: npx playwright install --with-deps --only-shell chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: .playwright-browsers
      - name: Package and verify production runtime
        run: |
          bash scripts/hosting/package.sh
          bash scripts/hosting/smoke.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: freakhosting-${{ env.RELEASE_ID }}
          path: dist/freakhosting-release.tar.gz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Upload and activate on FreakHosting
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.FREAKHOSTING_DEPLOY_ENABLED == 'true'
        env:
          SSH_HOST: ${{ secrets.FREAKHOSTING_SSH_HOST }}
          SSH_PORT: ${{ secrets.FREAKHOSTING_SSH_PORT }}
          SSH_USER: ${{ secrets.FREAKHOSTING_SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.FREAKHOSTING_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.FREAKHOSTING_KNOWN_HOSTS }}
        run: bash scripts/hosting/deploy.sh
