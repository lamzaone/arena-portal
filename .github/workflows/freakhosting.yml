name: FreakHosting

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never cancel an activation halfway through. PRs have separate queues.
concurrency:
  group: freakhosting-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      SITE_URL: ${{ vars.SITE_URL || 'https://tapped.ro' }}
      NEXT_PUBLIC_SERVER_NAME: ${{ vars.NEXT_PUBLIC_SERVER_NAME || 'ARENA.TAPPED.RO' }}
      NEXT_PUBLIC_SERVER_CONNECT_URL: ${{ vars.NEXT_PUBLIC_SERVER_CONNECT_URL || 'steam://connect/arena.tapped.ro' }}
      ECONOMY_PRICE_REFRESH_ENABLED: 'false'
      RELEASE_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --include=dev
      - run: npm test
      - name: Test packaging, restart and rollback
        run: |
          python3 scripts/hosting/package.test.py
          python3 scripts/hosting/activate.test.py
      - run: npm run build:release
      - name: Package and verify production runtime
        run: |
          bash scripts/hosting/package.sh
          bash scripts/hosting/smoke.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: freakhosting-${{ env.RELEASE_ID }}
          path: dist/freakhosting-release.tar.gz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Upload and activate on FreakHosting
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.FREAKHOSTING_DEPLOY_ENABLED == 'true'
        env:
          SSH_HOST: ${{ secrets.FREAKHOSTING_SSH_HOST }}
          SSH_PORT: ${{ secrets.FREAKHOSTING_SSH_PORT }}
          SSH_USER: ${{ secrets.FREAKHOSTING_SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.FREAKHOSTING_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.FREAKHOSTING_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${SSH_HOST:?Set FREAKHOSTING_SSH_HOST}"
          : "${SSH_USER:?Set FREAKHOSTING_SSH_USER}"
          : "${SSH_PRIVATE_KEY:?Set FREAKHOSTING_SSH_KEY}"
          : "${SSH_KNOWN_HOSTS:?Set FREAKHOSTING_KNOWN_HOSTS}"
          SSH_PORT="${SSH_PORT:-22}"
          [[ "$SSH_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$SSH_USER" =~ ^[a-zA-Z_][a-zA-Z0-9_.-]*$ ]]
          [[ "$SSH_PORT" =~ ^[0-9]+$ ]] && ((SSH_PORT > 0 && SSH_PORT <= 65535))
          umask 077
          key="$RUNNER_TEMP/freakhosting-key"
          hosts="$RUNNER_TEMP/freakhosting-known-hosts"
          trap 'rm -f -- "$key" "$hosts"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$hosts"
          options=(-i "$key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$hosts" -o ConnectTimeout=15)
          target="$SSH_USER@$SSH_HOST"
          ssh "${options[@]}" -p "$SSH_PORT" "$target" 'mkdir -p "$HOME/arena-portal"'
          scp "${options[@]}" -P "$SSH_PORT" dist/freakhosting-release.tar.gz "$target:arena-portal/$RELEASE_ID.tar.gz"
          ssh "${options[@]}" -p "$SSH_PORT" "$target" "bash -s -- '$RELEASE_ID'" < scripts/hosting/activate.sh
